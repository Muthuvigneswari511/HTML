<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="title-img.png">
    <title>Flipkart Clone</title>
    <link rel="stylesheet" href="ony.css">
</head>
<body>

<header class="header">
    <nav class="nav">

        <div class="dropdown">

            <!-- Hidden Checkbox -->
            <input type="checkbox" id="toggle">

            <!-- Yellow Button -->
            <label for="toggle" class="img">
                <img src="headerlogo.svg" class="logo">
                <span class="arrow">⌄</span>
            </label>

            <!-- Dropdown Menu -->
            <div class="dropdown-menu">
                <div class="item">Flipkart</div>
                <div class="item">Minutes</div>
                <div class="item">Grocery</div>
                <div class="item">Travel</div>
            </div>

        </div>

    </nav>
</header>

</body>
</html>
