<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg" href="title-img.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">

    <title>Online Shopping Site for Mobile,Electronics,Furniture,Grocery
        ,Lifestyle, Books & More. Best Offers!
    </title>
    <link rel="stylesheet" href="flipcartorg.css">
</head>

<body>
    <div class="full">
        <header class="header">
            <nav class="nav">
                <div class="dropdown">
                    <div class="img">
                        <img src="headerlogo.svg" class="logo">
                        <img src="download.svg" class="arrow">

                    </div>
                    <div class="dropdown-menu">
                        <div class="item">Flipkart</div>
                        <div class="item">Minutes</div>
                        <div class="item">Grocery</div>
                        <div class="item">Travel</div>
                    </div>
                </div>
                <div class="search-box">
                    <img src="search.svg">
                    <input type="text" placeholder="Search for Products, Brands and More">
                </div>

                <div class="nav-menus">
                    <div class="login-menu">
                        <img src="peopleicon.svg">
                        <span>Login</span>
                        <img src="download.svg">
                    </div>
                    <div class="More-menu">
                        <span>More</span>
                        <img src="download.svg">
                    </div>
                    <a href="#" class="cart-menu">
                        <img src="carticon.svg">
                        <span>Cart</span>
                    </a>
                </div>
            </nav>
        </header>
        <main class="main">
            <div class="location">
                <div class="location-center">
                    <img src="location.svg">
                    <div class="location-not-set">
                        <b>Location not set</b>
                    </div>
                    <div class="delivery-location">
                        <b>Select delivery location</b>
                    </div>
                    <img src="download.svg" class="right-arrow">
                </div>


            </div>
            <section class="full-section">
                <div class="banner">
                    <div class="banner-track">
                        <img src="videos.webp" alt="a">
                        <img src="199.png" alt="b">
                        <img src="999.jpg" alt="c">
                        <img src="fort.png" alt="d">
                        <img src="oppo.png" alt="e">
                        <img src="samsung.png" alt="f">
                        <img src="intel.png" alt="g">
                        <img src="work.png" alt="h">
                        <img src="techno.png" alt="i">
                        <img src="mivi.png" alt="j">

                        <!-- Duplicate images for smooth infinite scroll -->
                        <img src="videos.webp" alt="k">
                        <img src="199.png" alt="l">
                        <img src="999.jpg" alt="m">
                        <img src="fort.png" alt="n">
                        <img src="oppo.png" alt="o">
                        <img src="samsung.png" alt="p">
                        <img src="intel.png" alt="q">
                        <img src="work.png" alt="r">
                        <img src="techno.png" alt="s">
                        <img src="mivi.png" alt="t">
                    </div>

                </div>


    </div>

    </section>
    </main>
    </div>
</body>

</html>
