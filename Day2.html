<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <center><h2>Application form</h2></center>
        <h3>Personal Details</h3>
        <label>First Name</label><br><br>
        <input type="text"><br><br>
        <label>Last Name</label><br><br>
        <input type="text"><br><br>
        <label>Email</label><br><br>
        <input type="email"><br><br>
        <label>Contact</label><br><br>
        <input type="number"><br><br>
        <label>Year of Education</label><br><br>
        <input type="number"><br><br>
        <label>Gender</label><br><br>
        <select>
            <option>-Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select><br><br>

        <label>Experience in Years</label><br><br>
        <select>
            <option>-None-</option>
            <option>Fresher</option>
            <option>0-1 Years</option>
            <option>2-3 Years</option>
        </select><br><br>
        <label>Current employer</label><br><br>
        <input type="text"><br><br>
        <label>Preferred Location</label><br><br>
        <select>
            <option>Chennai</option>
            <option>Coimbatore</option>
            <option>Madurai</option>
        </select><br><br>
        <label>Upload your Resume</label><br><br>
        <input type="file" placeholder="Browse"><br><br>
        <button>Cancel</button>
        <button>Submit Application</button>
    </form>
    
</body>
</html>
