<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: antiquewhite;">
    <form>
        <h1>Student Registration Form</h1>
        <table>
            <tr><label>Roll No:</label><br><br>
        <input type="text"><br><br>
    </tr>
            <tr><label>Student Name:</label><br><br>
        <input type="text" placeholder="First Name"></tr> 
    <tr><input type="text" placeholder="Last Name"><br><br>
        <tr><label name="text">Father's Name:</label></tr>    
        <input type="text"><br><br></tr>
        <tr><label>Date of Birth</label><br><br>
        <input type="datetime-local"><br><br></tr>
        <tr><label>Mobile No:</label><br><br>
        <input type="number"><br><br></tr>
        <tr><label>Email id:</label>
        <input type="email"><br><br></tr>
        <tr><label>Password:</label>
        <input type="password"><br><br></tr>
        
        <label>Gender:</label><br><br>
        <input type="radio" name="gender"><label>Male</label>
        <input type="radio" name="gender"><label>Female</label>
        <input type="radio" name="gender"><label>Other</label>
        <label>Department:</label>
        <input type="checkbox"><label>CSE</label>
        <input type="checkbox"><label>IT</label>
        <input type="checkbox"><label>ECE</label>
        <input type="checkbox"><label>Civil</label>
        <input type="checkbox"><label>Mech</label><br><br>
        <select name="courses">
            <option>Java</option>
            <option>AI</option>
            <option>C++</option>
        </select>
        <label>Student Photo:</label><br><br>
        <input type="file"><br><br>
        <label>City:</label><br><br>
        <input type="text"><br><br>
        <textarea rows="2" cols="2"></textarea>
        </table>
       
    </form>
</body>
</html>
