<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <style>
        
        .box{
            display: flex;
            justify-content: center;
            align-items: center;
            gap:20px;
            
        }
    
        .box1{
            width: 200px;
            height: 200px;
            background-color: blue;
        }
        .box2{
            width: 200px;
            height: 200px;
            background-color: yellow;
        }
        .box3{
            width: 200px;
            height: 200px;
            background-color: aqua;
        }
        .box4{
            width: 200px;
            height: 200px;
            background-color: orange;
        }
        .box5{
            width: 200px;
            height: 200px;
            background-color: rgb(246, 124, 254);
        }
        .box6{
            width: 200px;
            height: 200px;
            background-color: rgb(0, 255, 51);
        }
        @media (max-width:500px) {
        .box{
            display: flex;
            justify-content: center;
            align-items: center;
            gap:10px;
            flex-wrap: wrap;
        }
        .box1{
            width: 100px;
            height: 100px;
            background-color: rgba(183, 91, 11, 0.874);
        }
        .box2{
            width: 100px;
            height: 100px;
            background-color: rgb(118, 12, 247);
        }
        .box3{
            width: 100px;
            height: 100px;
            background-color: rgb(18, 219, 112);
        }
        .box4{
            width: 100px;
            height: 100px;
            background-color: rgb(38, 38, 3);
        }
        .box5{
            width: 100px;
            height: 100px;
            background-color: rgb(219, 130, 29);
        }
        .box6{
            width: 100px;
            height: 100px;
            background-color: rgb(243, 119, 169);
        }
    }
    
    </style>
</head>
<body>
    <div class="box">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <div class="box5"></div>
        <div class="box6"></div>
    </div>
   
    
    
</body>
</html>
